<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>People &mdash; {{ race_label }}</title>
    <link rel="stylesheet" href="static/styles.css" />
  </head>
  <body class="results-page">
    <main class="results-wrap">
      <div class="people-header">
        <a class="people-back" href=".">&#8592; Back to races</a>
        <h1 class="people-title">{{ race_label }}</h1>
        <p class="results-count">{{ person_count }} distinct people <span class="ai-guessed">(AI guessed)</span></p>
      </div>
      <hr class="results-divider" />

      {% if person_count == 0 %}
      <p class="results-empty">No people index available for this race yet.</p>
      {% else %}
      <section class="people-grid">
        {% for p in persons %}
        <a
          class="person-card"
          href="person?race_label={{ race_label | urlencode }}&amp;pid={{ p.pid | urlencode }}"
        >
          <img
            src="{{ p.representative.face_preview_url or p.representative.preview_url }}"
            alt="Person {{ loop.index }}"
            class="person-image"
            loading="lazy"
            onerror="this.classList.add('is-broken')"
          />
          <div class="person-meta">
            {{ p.photo_count }} photo{{ '' if p.photo_count == 1 else 's' }}
          </div>
        </a>
        {% endfor %}
      </section>
      {% endif %}
    </main>
  </body>
</html>
